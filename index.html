<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ethan Griesman | Portfolio</title>

  <!-- Bootstrap -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

  <meta name="theme-color" content="#0a0f1f"/>

  <style>
    :root{
      --ink: #e8eef8;
      --ink-muted: #c0cae6;
      --depth1: #09132b;
      --depth2: #081127;
      --depth3: #070f23;
      --caret: rgba(255,255,255,.9);
    }

    /* === Page layout: footer sticks to bottom; no gap below === */
    html, body { height: 100%; }
    body{
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: var(--ink);
      background: #0b1224; /* fallback under canvas */
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    main{ flex: 1; }

    /* === Site-wide galaxy canvas behind everything === */
    #galaxyCanvas{
      position: fixed;
      inset: 0;               /* full viewport */
      width: 100vw;
      height: 100vh;
      z-index: 0;             /* under all content */
      pointer-events: none;
      background:
        radial-gradient(1200px 700px at 50% 30%, rgba(40,60,120,.18), transparent 65%),
        radial-gradient(900px 600px at 70% 80%, rgba(20,40,90,.14), transparent 70%);
      filter: saturate(1.08) contrast(1.05);
    }

    /* All content sits above the canvas */
    .navbar, .page, footer { position: relative; z-index: 2; }

    /* Navbar */
    .navbar{
      background: linear-gradient(90deg, #0a142c, #081025 60%, #070d1f);
      border-bottom: 1px solid rgba(255,255,255,.06);
      backdrop-filter: saturate(1.2) blur(4px);
    }
    .navbar .navbar-brand{ color:#e8eef8; font-weight:700; letter-spacing:.2px; }
    .navbar-dark .navbar-nav .nav-link{ color:#c9d3e7; }
    .navbar-dark .navbar-nav .nav-link:hover,
    .navbar-dark .navbar-nav .nav-link.active{ color:#ffffff; }

    .page{ padding-top: 84px; }

    /* === HERO (text area; canvas is site-wide now) === */
    .hero{
      position: relative;
      overflow: hidden;
      padding: clamp(64px, 12vw, 128px) 0 clamp(56px, 8vw, 96px);
      text-align: center;
      isolation: isolate;
    }
    .hero .container{ max-width: 1040px; }

    /* Soft glow behind text (above canvas, below text) */
    .hero-card{
      position: absolute;
      inset: auto 50% -60px 50%;
      transform: translateX(-50%);
      width: min(980px, 92%);
      height: 140px;
      background: radial-gradient(600px 220px at 50% 50%, rgba(13,110,253,.18), transparent 70%);
      filter: blur(18px);
      pointer-events: none;
      z-index: 1;
    }

    /* Headings */
    .hero h1, .hero h2, .hero h3{
      font-family: 'Space Grotesk', Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      letter-spacing: .2px;
      margin: 0;
      text-shadow:
        0 1px 0 var(--depth1),
        0 2px 0 var(--depth1),
        0 3px 0 var(--depth2),
        0 4px 0 var(--depth2),
        0 5px 0 var(--depth3),
        0 6px 0 var(--depth3),
        0 8px 12px rgba(0,0,0,.45);
    }
    .hero h1{ font-weight: 800; font-size: clamp(2.9rem, 7.2vw, 4.8rem); line-height: 1.05; min-height: 1.2em; }
    .hero h2{ font-weight: 800; font-size: clamp(1.6rem, 4.8vw, 2.6rem); margin-top: .9rem; }
    .hero h3{ font-weight: 700; font-size: clamp(1.1rem, 3vw, 1.5rem); color: var(--ink); margin-top: 1rem; }

    /* Typewriter caret + flicker */
    .typewriter{ display: inline-block; white-space: nowrap; overflow: hidden; border-right: 2px solid var(--caret); }
    @keyframes caretBlink { 0%,49%{border-right-color:var(--caret);} 50%,100%{border-right-color:transparent;} }
    .typewriter.typing { animation: caretBlink .9s step-end infinite; }
    @keyframes flicker {
      0%{ text-shadow:none; } 10%{ text-shadow:0 0 18px rgba(255,255,255,.3); }
      13%{ text-shadow:none; } 18%{ text-shadow:0 0 14px rgba(255,255,255,.25); }
      22%{ text-shadow:none; } 30%,100%{ text-shadow:0 0 22px rgba(13,110,253,.35); }
    }
    .flicker { animation: flicker 1.4s ease-out 1 both; }

    /* Slide-in for "My name is" */
    .line-in { animation: lineIn .7s cubic-bezier(.2,.7,.2,1) .15s both; }
    @keyframes lineIn { from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);} }

    .prelude{ opacity:.9; font-weight:700; letter-spacing:.2px; }

    /* Name = pure white, no gloss */
    .name-highlight{
      color:#fff;
      text-shadow:
        0 1px 0 var(--depth1),
        0 2px 0 var(--depth1),
        0 3px 0 var(--depth2),
        0 5px 10px rgba(0,0,0,.45);
      font-weight:900; letter-spacing:.3px; text-decoration:none;
    }

    /* Per-letter ripple jump */
    .jump-letter{ display:inline-block; transform-origin:bottom center; animation:jumpRipple 780ms cubic-bezier(.2,.7,.2,1) 1 both; }
    @keyframes jumpRipple{
      0%{transform:translateY(0) scale(1);}
      28%{transform:translateY(-20px) scale(1.03);}
      58%{transform:translateY(6px) scale(.995);}
      78%{transform:translateY(-3px) scale(1.01);}
      100%{transform:translateY(0) scale(1);}
    }

    /* Welcome wave with spacing */
    .welcome-line .word{ display:inline-block; position:relative; }
    .welcome-line .word>span{ display:inline-block; animation:waveUp 900ms cubic-bezier(.2,.8,.2,1) 1 both; }
    @keyframes waveUp{
      0%{ transform:translateY(12px); opacity:0; filter:blur(2px); }
      40%{ opacity:1; filter:blur(0); }
      60%{ transform:translateY(-6px); }
      100%{ transform:translateY(0); }
    }

    /* Footer (no extra space; no glow) */
    footer{ background:#070d1f; color:#b7c3d9; text-align:center; padding:18px 0 20px; margin-top:0; }

    @media (prefers-reduced-motion: reduce){
      .typewriter{ border-right:none !important; }
      .typing, .flicker, .line-in, .welcome-line .word>span, .jump-letter{ animation:none !important; }
    }
  </style>
</head>
<body>

<!-- SITE-WIDE GALAXY BACKGROUND -->
<canvas id="galaxyCanvas" aria-hidden="true"></canvas>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="/">Ethan Griesman</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#nav" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div id="nav" class="collapse navbar-collapse">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item active"><a class="nav-link" href="/home/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/about/">About</a></li>
        <li class="nav-item"><a class="nav-link" href="/experience/">Experience</a></li>
        <li class="nav-item"><a class="nav-link" href="/projects/">Projects</a></li>
        <li class="nav-item"><a class="nav-link" href="/resume/">Resume</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="page">
  <section id="home" class="hero">
    <div class="container" id="hero-seq">
      <h1 class="mb-2" id="hello"><span class="typewriter typing" id="hello-typing"></span></h1>

      <h2 class="mb-3" id="name-line">
        <span class="prelude">My name is</span>&nbsp;
        <span class="name-highlight" id="name-animated">Ethan Griesman</span>
      </h2>

      <h3 class="mb-4 welcome-line" id="welcome-line">Welcome to my Portfolio.</h3>
    </div>

    <div class="hero-card" aria-hidden="true"></div>
  </section>
</main>

<footer>
  <p class="mb-0">&copy; 2026 Ethan Griesman. All rights reserved.</p>
</footer>

<!-- JS: rotating galaxy, no mouse parallax -->
<script>
  const CONFIG = {
    helloText: 'Hello!',
    typingSpeedMs: 85,
    helloHoldAfterTyping: 250,
    nameJumpWindowMs: [1200, 4200],
    nameJumpDurationMs: 780,
    welcomeWordDelayMs: 95,
    revealDelays: { nameLineAfterHelloMs: 150, welcomeAfterNameMs: 140 },
    galaxy: {
      stars: 1800, armStars: 1400, bulgeStars: 600,
      armTightness: 0.27, armNoise: 0.55,
      rotationSpeed: 0.0006, scale: 1.0
    }
  };

  (function(){
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const helloSpan = document.getElementById('hello-typing');
    const helloH1 = document.getElementById('hello');
    const nameLine = document.getElementById('name-line');
    const nameSpan = document.getElementById('name-animated');
    const welcomeEl = document.getElementById('welcome-line');

    const canvas = document.getElementById('galaxyCanvas');
    const ctx = canvas.getContext('2d');

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    async function runHello(){
      const text = CONFIG.helloText;
      if (prefersReduced) {
        helloSpan.textContent = text;
        helloSpan.classList.remove('typing');
        helloH1.classList.add('flicker');
        return;
      }
      helloSpan.textContent = '';
      helloSpan.classList.add('typing');
      for (let i = 0; i < text.length; i++){ helloSpan.textContent += text[i]; await sleep(CONFIG.typingSpeedMs); }
      helloSpan.classList.remove('typing');
      await sleep(CONFIG.helloHoldAfterTyping);
      helloH1.classList.add('flicker');
    }

    function runNameLine(){
      nameLine.classList.add('line-in');
      const text = nameSpan.textContent;
      nameSpan.textContent = '';
      const frag = document.createDocumentFragment();
      const [winStart, winEnd] = CONFIG.nameJumpWindowMs;
      for (const ch of text){
        if (ch === ' '){ frag.appendChild(document.createTextNode(' ')); continue; }
        const s = document.createElement('span');
        s.className = 'jump-letter';
        s.textContent = ch;
        if (!prefersReduced){
          const delay = winStart + Math.random() * (winEnd - winStart);
          s.style.animationDelay = `${delay}ms`;
          s.style.animationDuration = `${CONFIG.nameJumpDurationMs}ms`;
        } else { s.style.animation = 'none'; }
        frag.appendChild(s);
      }
      nameSpan.appendChild(frag);
    }

    function runWelcome(){
      const words = welcomeEl.textContent.trim().split(/\s+/);
      const frag = document.createDocumentFragment();
      words.forEach((w, i) => {
        if (i>0) frag.appendChild(document.createTextNode(' '));
        const wrap = document.createElement('span'); wrap.className = 'word';
        const inner = document.createElement('span'); inner.textContent = w;
        if (!prefersReduced) inner.style.animationDelay = `${i * CONFIG.welcomeWordDelayMs}ms`;
        wrap.appendChild(inner); frag.appendChild(wrap);
      });
      welcomeEl.textContent = ''; welcomeEl.appendChild(frag);
    }

    // ==== Galaxy (site-wide fixed canvas, continuous rotation) ====
    let W=0,H=0,cx=0,cy=0,t=0;
    let stars=[], bulge=[], armPts=[];
    const g = CONFIG.galaxy;

    function resizeCanvas(){
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const vw = window.innerWidth, vh = window.innerHeight;
      canvas.style.width = vw + 'px'; canvas.style.height = vh + 'px';
      canvas.width = Math.floor(vw * dpr); canvas.height = Math.floor(vh * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      W = vw; H = vh; cx = W/2; cy = H*0.45;
    }

    function randn(mean=0, std=1){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return mean + std*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }

    function makeGalaxy(){
      stars=[]; bulge=[]; armPts=[];
      for(let i=0;i<g.bulgeStars;i++){
        const r = Math.abs(randn(0, 60)) * (0.6 + Math.random()*0.8) * g.scale;
        const a = Math.random()*Math.PI*2;
        bulge.push({ x:r*Math.cos(a), y:r*Math.sin(a)*0.7, s:0.7+Math.random()*1.6,
          c:`rgba(${200+Math.floor(Math.random()*55)}, ${180+Math.floor(Math.random()*40)}, 255, ${0.25+Math.random()*0.5})` });
      }
      const arms=2;
      for(let k=0;k<arms;k++){
        const armOffset = (k/arms)*Math.PI*2;
        for(let i=0;i<g.armStars;i++){
          const theta = (i/g.armStars)*(Math.PI*5) + armOffset;
          const rBase = 20*Math.exp(g.armTightness*theta)*g.scale;
          const r = rBase + randn(0, g.armNoise*28);
          const a = theta + randn(0,0.08);
          const ySkew = (Math.sin(theta*2)*6) + randn(0,2);
          armPts.push({ x:r*Math.cos(a), y:r*Math.sin(a)*0.72 + ySkew,
                        s:0.6+Math.random()*1.4, hue:210+Math.random()*60, alpha:0.15+Math.random()*0.55 });
        }
      }
      for(let i=0;i<g.stars;i++){
        const R = Math.random()*Math.max(W,H)*0.7 + 120;
        const a = Math.random()*Math.PI*2;
        stars.push({ x:R*Math.cos(a), y:R*Math.sin(a)*0.6, s:Math.random()*1.3+0.2, a:0.08+Math.random()*0.25 });
      }
    }

    function dot(x,y,r, col){ ctx.beginPath(); ctx.fillStyle = col; ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }

    function draw(){
      ctx.clearRect(0,0,W,H);
      ctx.save(); ctx.translate(cx, cy);
      const rot = prefersReduced ? 0 : t * g.rotationSpeed; ctx.rotate(rot);

      const halo = ctx.createRadialGradient(0,0,0, 0,0, Math.max(W,H)*0.45);
      halo.addColorStop(0, "rgba(255,255,255,0.10)");
      halo.addColorStop(0.2, "rgba(200,220,255,0.08)");
      halo.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(0,0, Math.max(W,H)*0.45, 0, Math.PI*2); ctx.fill();

      stars.forEach(s=> dot(s.x, s.y, s.s, `rgba(255,255,255,${s.a})`));
      armPts.forEach(p=> dot(p.x, p.y, p.s, `hsla(${p.hue}, 100%, ${65 + Math.random()*15}%, ${p.alpha})`));
      bulge.forEach(b=> dot(b.x, b.y, b.s, b.c));

      const core = ctx.createRadialGradient(0,0,0, 0,0, 120);
      core.addColorStop(0, "rgba(255,255,240,0.8)");
      core.addColorStop(0.35, "rgba(255,220,200,0.45)");
      core.addColorStop(0.9, "rgba(120,160,255,0.06)");
      core.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = core; ctx.beginPath(); ctx.arc(0,0, 140, 0, Math.PI*2); ctx.fill();

      ctx.restore();
      t++;
      if (!prefersReduced) requestAnimationFrame(draw);
    }

    function boot(){ resizeCanvas(); makeGalaxy(); draw(); }
    window.addEventListener('resize', boot);
    boot();

    // Text sequence
    (async function(){
      await runHello();
      await sleep(CONFIG.revealDelays.nameLineAfterHelloMs);
      runNameLine();
      await sleep(CONFIG.revealDelays.welcomeAfterNameMs);
      runWelcome();
    })();
  })();
</script>

  
</body>
</html>
