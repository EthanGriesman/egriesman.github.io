<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ethan Griesman | Portfolio</title>

  <!-- Bootstrap -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet" />

  <!-- Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon-180x180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0f1f"/>

  <!-- Your site-wide CSS (kept) -->
  <link href="styles.css" rel="stylesheet" />

  <style>
    :root{
      --bg: #0b1224;
      --bg-grad: linear-gradient(180deg, #0a132a 0%, #0b1224 100%);
      --ink: #e8eef8;
      --ink-muted: #b7c3d9;
      --accent: #0d6efd;
      --btn-ink: #0e1528;
      --ring: rgba(13,110,253,.22);
      --radius: 16px;
      --shadow-hero: 0 20px 60px rgba(7,14,32,.35);
      --container: 1040px;
    }

    html, body { height: 100%; }
    body{
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:
        radial-gradient(1200px 520px at 85% -10%, rgba(13,110,253,.18), transparent 60%),
        var(--bg-grad);
      color: var(--ink);
      margin: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Navbar */
    .navbar{
      background: linear-gradient(90deg, #0a142c, #081025 60%, #070d1f);
      border-bottom: 1px solid rgba(255,255,255,.06);
      backdrop-filter: saturate(1.2) blur(4px);
    }
    .navbar .navbar-brand{ color:#e8eef8; font-weight:600; letter-spacing:.2px; }
    .navbar-dark .navbar-nav .nav-link{ color:#c9d3e7; }
    .navbar-dark .navbar-nav .nav-link:hover,
    .navbar-dark .navbar-nav .nav-link.active{ color:#ffffff; }

    .page{ padding-top: 84px; }
    .container{ max-width: var(--container); }

    /* HERO */
    .hero{
      padding: clamp(56px, 12vw, 120px) 0 clamp(48px, 8vw, 80px);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Headings: new display font */
    .hero h1, .hero h2, .hero h3{
      font-family: 'Space Grotesk', Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      letter-spacing: .2px;
      margin: 0;
    }

    /* Baseline sizes (unchanged feel) */
    .hero h1{
      font-weight: 800;
      font-size: clamp(2.6rem, 7vw, 4.25rem);
      text-shadow: 0 6px 26px rgba(13,110,253,.25);
      line-height: 1.05;
    }
    .hero h2{
      font-weight: 800;
      font-size: clamp(1.4rem, 4vw, 2.15rem);
      margin-top: .65rem;
    }
    .hero h3{
      font-weight: 600;
      font-size: clamp(1.05rem, 2.8vw, 1.3rem);
      color: var(--ink-muted);
      margin-top: 1rem;
    }

    /* Animated gradient name */
    .name-highlight{
      position: relative;
      display: inline-block;
      background: linear-gradient(90deg, #7aa8ff, #a1ffe0, #ffd38b, #7aa8ff);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 6s linear infinite;
      text-decoration: none; /* we’ll use a custom underline instead */
    }
    .name-highlight::after{
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -.25em;
      height: 3px;
      background: linear-gradient(90deg, rgba(13,110,253,.0), rgba(13,110,253,.6), rgba(13,110,253,.0));
      transform-origin: left;
      transform: scaleX(0);
      border-radius: 999px;
      animation: underlineGrow .9s ease .35s forwards;
    }

    /* Decorative glow behind hero */
    .hero-card{
      position: absolute;
      inset: auto 50% -60px 50%;
      transform: translateX(-50%);
      width: min(980px, 92%);
      height: 140px;
      background: radial-gradient(600px 220px at 50% 50%, rgba(13,110,253,.18), transparent 70%);
      filter: blur(18px);
      pointer-events: none;
    }

    /* === Animations === */

    /* Shimmering gradient */
    @keyframes shimmer {
      0%   { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }
    /* Underline grow */
    @keyframes underlineGrow {
      0%   { transform: scaleX(0); opacity: .0; }
      60%  { opacity: 1; }
      100% { transform: scaleX(1); opacity: 1; }
    }

    /* Letter pop-in (with slight 3D) */
    .pop-seq span{
      display: inline-block;
      transform: translateY(12px) rotateX(30deg);
      opacity: 0;
      filter: blur(2px);
      animation: popIn .7s cubic-bezier(.2,.8,.2,1) forwards;
    }
    @keyframes popIn{
      0%{
        opacity: 0;
        transform: translateY(12px) rotateX(30deg) scale(.98);
        filter: blur(2px);
      }
      60%{
        opacity: 1;
        transform: translateY(-2px) rotateX(0) scale(1.02);
        filter: blur(0);
      }
      100%{
        opacity: 1;
        transform: translateY(0) rotateX(0) scale(1);
      }
    }

    /* Subtle word slide for h3 */
    .slide-words span{
      display: inline-block;
      transform: translateY(8px);
      opacity: 0;
      animation: slideUp .6s ease-out forwards;
    }
    @keyframes slideUp{
      to { transform: translateY(0); opacity: 1; }
    }

    /* Trigger only when in view */
    .reveal .pop-seq span{ animation-play-state: running; }
    .reveal .slide-words span{ animation-play-state: running; }

    /* Respect reduced motion */
    @media (prefers-reduced-motion: reduce){
      .name-highlight{ animation: none; }
      .name-highlight::after{ animation: none; transform: scaleX(1); }
      .pop-seq span, .slide-words span{
        animation: none !important;
        transform: none !important;
        opacity: 1 !important;
        filter: none !important;
      }
    }

    footer{
      background:#070d1f;
      color:#b7c3d9;
      text-align:center;
      padding: 14px 0;
      margin-top: 36px;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">Ethan Griesman</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#nav" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div id="nav" class="collapse navbar-collapse">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item active"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="experience.html">Experience</a></li>
        <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
        <li class="nav-item"><a class="nav-link" href="resume.html">Resume</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="page">
  <section id="home" class="hero">
    <div class="container" id="hero-anim">
      <!-- h1 & h3 will be split into letters, staggered -->
      <h1 class="mb-2 pop-target">Hello!</h1>

      <!-- Name line: animated gradient + underline -->
      <h2 class="mb-3">
        My name is <span class="name-highlight">Ethan Griesman</span>
      </h2>

      <!-- h3 will slide word-by-word -->
      <h3 class="mb-4 slide-target">Welcome to my portfolio.</h3>
    </div>

    <div class="hero-card" aria-hidden="true"></div>
  </section>
</main>

<footer>
  <p class="mb-0">&copy; 2025 Ethan Griesman. All rights reserved.</p>
</footer>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script>
  // Helper: wrap each letter in a span with incremental delays
  function splitLetters(el, baseDelay = 0, step = 28) {
    const text = el.textContent;
    el.textContent = '';
    const frag = document.createDocumentFragment();
    let delay = baseDelay;
    for (const ch of text) {
      const span = document.createElement('span');
      span.textContent = ch;
      span.style.animationDelay = (delay/1000) + 's';
      frag.appendChild(span);
      delay += (ch.trim() ? step : step/2); // smaller step for spaces
    }
    el.classList.add('pop-seq');
    el.appendChild(frag);
  }

  // Helper: wrap each word for slide-up with incremental delays
  function splitWords(el, baseDelay = 100, step = 70) {
    const words = el.textContent.split(' ');
    el.textContent = '';
    const frag = document.createDocumentFragment();
    words.forEach((w, i) => {
      const span = document.createElement('span');
      span.textContent = (i ? ' ' : '') + w;
      span.style.animationDelay = ((baseDelay + i*step)/1000) + 's';
      frag.appendChild(span);
    });
    el.classList.add('slide-words');
    el.appendChild(frag);
  }

  // Prepare elements
  const h1 = document.querySelector('.pop-target');
  const h3 = document.querySelector('.slide-target');
  if (h1) splitLetters(h1, 0, 32);
  if (h3) splitWords(h3, 150, 80);

  // Reveal on view
  const hero = document.getElementById('hero-anim');
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!prefersReduced && hero) {
    const io = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          hero.classList.add('reveal');
          io.disconnect();
        }
      });
    }, { threshold: .4 });
    io.observe(hero);
  } else {
    // No animation / reduced motion: show immediately
    hero && hero.classList.add('reveal');
  }
</script>

</body>
</html>
