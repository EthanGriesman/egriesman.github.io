<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ethan Griesman | Portfolio</title>

  <!-- Bootstrap -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet" />

  <!-- Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon-180x180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0f1f"/>

  <!-- Site-wide CSS -->
  <link href="styles.css" rel="stylesheet" />

  <style>
    :root{
      --bg: #0b1224;
      --bg-grad: linear-gradient(180deg, #0a132a 0%, #0b1224 100%);
      --ink: #e8eef8;
      --ink-muted: #b7c3d9;
      --accent: #0d6efd;
      --btn-ink: #0e1528;
      --ring: rgba(13,110,253,.22);
      --radius: 16px;
      --shadow-hero: 0 20px 60px rgba(7,14,32,.35);
      --container: 1040px;

      /* Animation palette */
      --blue: #1ea7ff;
      --blue-glow: rgba(30,167,255,.28);
      --caret: rgba(255,255,255,.9);

      /* 3D text depth colors */
      --depth1: #09132b;
      --depth2: #081127;
      --depth3: #070f23;

      /* Nebula colors (tweak to taste) */
      --nebulaA: rgba(40, 110, 255, 0.25);
      --nebulaB: rgba(225, 75, 255, 0.22);
      --nebulaC: rgba(0, 230, 190, 0.18);
    }

    html, body { height: 100%; }
    body{
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:
        radial-gradient(1200px 520px at 85% -10%, rgba(13,110,253,.18), transparent 60%),
        var(--bg-grad);
      color: var(--ink);
      margin: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Navbar */
    .navbar{
      background: linear-gradient(90deg, #0a142c, #081025 60%, #070d1f);
      border-bottom: 1px solid rgba(255,255,255,.06);
      backdrop-filter: saturate(1.2) blur(4px);
    }
    .navbar .navbar-brand{ color:#e8eef8; font-weight:600; letter-spacing:.2px; }
    .navbar-dark .navbar-nav .nav-link{ color:#c9d3e7; }
    .navbar-dark .navbar-nav .nav-link:hover,
    .navbar-dark .navbar-nav .nav-link.active{ color:#ffffff; }

    .page{ padding-top: 84px; }
    .container{ max-width: var(--container); position: relative; z-index: 2; } /* above galaxy */

    /* HERO */
    .hero{
      padding: clamp(56px, 12vw, 120px) 0 clamp(48px, 8vw, 80px);
      text-align: center;
      position: relative;
      overflow: hidden;
      isolation: isolate; /* so backdrop filters don't bleed */
      perspective: 800px; /* subtle depth for 3D text feel */
    }

    /* === GALAXY BACKGROUND LAYERS === */
    .galaxy {
      position: absolute;
      inset: -5% -5% -5% -5%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      transform-style: preserve-3d;
    }

    /* Nebula clouds (soft, colorful, slow drift) */
    .galaxy-nebula {
      position: absolute; inset: -20% -20% -20% -20%;
      opacity: 0.9;
      background:
        radial-gradient(800px 500px at 20% 30%, var(--nebulaA), transparent 60%),
        radial-gradient(700px 420px at 80% 20%, var(--nebulaB), transparent 65%),
        radial-gradient(900px 520px at 60% 80%, var(--nebulaC), transparent 60%),
        radial-gradient(600px 360px at 10% 85%, rgba(255,180,80,.15), transparent 65%),
        radial-gradient(900px 600px at 110% -10%, rgba(120,160,255,.18), transparent 65%);
      filter: blur(6px) saturate(1.05);
      animation: drift-nebula 80s linear infinite;
      transform: translateZ(-40px); /* depth for parallax */
    }

    /* Fine star field (tiny points) */
    .galaxy-stars {
      position: absolute; inset: -10% -10% -10% -10%;
      background-image:
        radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,.9), transparent 60%),
        radial-gradient(1.5px 1.5px at 30% 70%, rgba(255,255,255,.85), transparent 60%),
        radial-gradient(1.5px 1.5px at 55% 40%, rgba(255,255,255,.9), transparent 60%),
        radial-gradient(1.5px 1.5px at 75% 15%, rgba(255,255,255,.75), transparent 60%),
        radial-gradient(2px 2px at 90% 60%, rgba(255,255,255,.85), transparent 60%),
        radial-gradient(1.5px 1.5px at 45% 85%, rgba(255,255,255,.8), transparent 60%),
        radial-gradient(1.2px 1.2px at 15% 55%, rgba(255,255,255,.8), transparent 60%),
        radial-gradient(1.2px 1.2px at 65% 85%, rgba(255,255,255,.8), transparent 60%);
      background-repeat: no-repeat;
      opacity: .8;
      animation: drift-stars 120s linear infinite;
      transform: translateZ(-20px);
    }

    /* Bigger twinkling stars */
    .galaxy-twinkle {
      position: absolute; inset: -10% -10% -10% -10%;
      background-image:
        radial-gradient(2.5px 2.5px at 22% 35%, rgba(255,255,240,.95), transparent 55%),
        radial-gradient(2.5px 2.5px at 70% 62%, rgba(255,255,240,.9),  transparent 55%),
        radial-gradient(3px 3px     at 85% 28%, rgba(255,255,240,.95), transparent 55%),
        radial-gradient(2.2px 2.2px at 40% 18%, rgba(255,255,240,.9),  transparent 55%),
        radial-gradient(2.2px 2.2px at 12% 78%, rgba(255,255,240,.9),  transparent 55%),
        radial-gradient(2px 2px     at 58% 90%, rgba(255,255,240,.8),  transparent 55%);
      background-repeat: no-repeat;
      filter: drop-shadow(0 0 6px rgba(255,255,255,.25));
      animation: twinkle 3.2s ease-in-out infinite alternate, drift-twinkle 160s linear infinite;
      opacity: .85;
      transform: translateZ(-10px);
    }

    /* Shooting stars container (stars are injected at runtime) */
    .galaxy-shooting {
      position: absolute;
      inset: -10% -10% -10% -10%;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
      transform: translateZ(-5px);
    }

    /* A single shooting star */
    .shooting-star {
      position: absolute;
      width: 2px; /* core thickness */
      height: 2px;
      background: radial-gradient(circle, #fff 0%, rgba(255,255,255,.1) 70%);
      box-shadow:
        0 0 6px rgba(255,255,255,.7),
        0 0 12px rgba(120,160,255,.5);
      transform: translate3d(0,0,0) rotate(-18deg);
      opacity: 0;
    }
    /* the tail */
    .shooting-star::after{
      content: '';
      position: absolute;
      left: -140px; top: 0;
      height: 2px;
      width: 140px; /* tail length */
      background: linear-gradient(90deg, rgba(255,255,255,.0) 0%, rgba(255,255,255,.8) 100%);
      filter: blur(0.6px);
    }

    /* Flight path animation; distance controlled by translate values */
    @keyframes shoot {
      0%   { opacity: 0; transform: translate3d(0,0,0) rotate(-18deg); }
      5%   { opacity: 1; }
      100% { opacity: 0; transform: translate3d(-120vw, -40vh, 0) rotate(-18deg); }
    }

    @keyframes drift-nebula {
      0%   { transform: translate3d(0,0,0) scale(1.02); }
      50%  { transform: translate3d(-2%, -1%, 0) scale(1.03); }
      100% { transform: translate3d(0,0,0) scale(1.02); }
    }
    @keyframes drift-stars {
      0%   { transform: translate3d(0,0,0) }
      100% { transform: translate3d(-3%, -5%, 0) }
    }
    @keyframes drift-twinkle {
      0%   { transform: translate3d(0,0,0) }
      100% { transform: translate3d(-6%, -3%, 0) }
    }
    @keyframes twinkle {
      0%   { opacity: .55; filter: drop-shadow(0 0 2px rgba(255,255,255,.15)); }
      100% { opacity: 1;   filter: drop-shadow(0 0 8px rgba(255,255,255,.35)); }
    }

    /* Headings use display font + 3D */
    .hero h1, .hero h2, .hero h3{
      font-family: 'Space Grotesk', Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      letter-spacing: .2px;
      margin: 0;
      transform-style: preserve-3d;
    }

    .hero h1{
      font-weight: 800;
      font-size: clamp(2.6rem, 7vw, 4.25rem);
      line-height: 1.05;
      min-height: 1.2em;
      transform: translateZ(30px);
    }
    .hero h2{
      font-weight: 800;
      font-size: clamp(1.35rem, 4.2vw, 2.2rem);
      margin-top: .8rem;
      transform: translateZ(25px);
    }
    .hero h3{
      font-weight: 600;
      font-size: clamp(1.05rem, 2.8vw, 1.35rem);
      color: var(--ink);
      margin-top: 1rem;
      transform: translateZ(20px);
    }

    /* Decorative glow (above galaxy but behind text) */
    .hero-card{
      position: absolute;
      inset: auto 50% -60px 50%;
      transform: translateX(-50%);
      width: min(980px, 92%);
      height: 140px;
      background: radial-gradient(600px 220px at 50% 50%, rgba(13,110,253,.18), transparent 70%);
      filter: blur(18px);
      pointer-events: none;
      z-index: 1;
    }

    /* === 3D TEXT EFFECT (applied to all three lines) === */
    .text-3d{
      text-shadow:
        0 1px 0 var(--depth1),
        0 2px 0 var(--depth1),
        0 3px 0 var(--depth2),
        0 4px 0 var(--depth2),
        0 5px 0 var(--depth3),
        0 6px 0 var(--depth3),
        0 8px 12px rgba(0,0,0,.45);
    }

    /* === COMPLEX ANIMATIONS (text) === */

    /* 1) Typewriter + caret + neon flicker for h1 */
    .typewriter{
      display: inline-block;
      position: relative;
      white-space: nowrap;
      overflow: hidden;
      border-right: 2px solid var(--caret);
    }
    @keyframes caretBlink {
      0%, 49% { border-right-color: var(--caret); }
      50%, 100% { border-right-color: transparent; }
    }
    .typewriter.typing { animation: caretBlink .9s step-end infinite; }

    @keyframes flicker {
      0%   { text-shadow: none; }
      10%  { text-shadow: 0 0 18px rgba(255,255,255,.3); }
      13%  { text-shadow: none; }
      18%  { text-shadow: 0 0 14px rgba(255,255,255,.25); }
      22%  { text-shadow: none; }
      30%,100% { text-shadow: 0 0 22px rgba(13,110,253,.35); }
    }
    .flicker { animation: flicker 1.4s ease-out 1 both; }

    /* 2) Slide-in for "My name is" */
    .line-in { animation: lineIn .7s cubic-bezier(.2,.7,.2,1) .15s both; }
    @keyframes lineIn {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Name styling (bright blue + glow + 3D) */
    .name-highlight{
      color: var(--blue);
      text-shadow:
        0 1px 0 var(--depth1),
        0 2px 0 var(--depth1),
        0 3px 0 var(--depth2),
        0 4px 0 var(--depth2),
        0 5px 0 var(--depth3),
        0 6px 0 var(--depth3),
        0 0 16px var(--blue-glow),
        0 8px 12px rgba(0,0,0,.45);
      font-weight: 800;
      text-decoration: none;
      position: relative;
      transform: translateZ(25px);
    }

    /* Per-letter jump (elastic-ish) */
    .jump-letter{
      display: inline-block;
      will-change: transform;
      transform-origin: bottom center;
      animation: jumpElastic 700ms cubic-bezier(.2,.7,.2,1) 1 both;
    }
    @keyframes jumpElastic {
      0%   { transform: translateY(0) scale(1); }
      30%  { transform: translateY(-18px) scale(1.03); }
      60%  { transform: translateY(6px)  scale(.995); }
      80%  { transform: translateY(-4px) scale(1.01); }
      100% { transform: translateY(0)    scale(1); }
    }

    /* 3) Word-by-word wave for h3 — stays visible */
    .welcome-line { position: relative; }
    .welcome-line .word{
      display: inline-block;
      position: relative;
    }
    .welcome-line .word > span{
      display: inline-block;
      animation: waveUp 850ms cubic-bezier(.2,.8,.2,1) 1 both;
    }
    @keyframes waveUp {
      0%   { transform: translateY(12px); opacity: 0; filter: blur(2px); }
      40%  { opacity: 1; filter: blur(0); }
      60%  { transform: translateY(-6px); }
      100% { transform: translateY(0); }
    }

    /* Reduced motion: freeze galaxy + text animations */
    @media (prefers-reduced-motion: reduce){
      .galaxy-nebula, .galaxy-stars, .galaxy-twinkle { animation: none !important; }
      .typewriter { border-right: none !important; }
      .typing, .flicker, .line-in,
      .welcome-line .word > span, .jump-letter { animation: none !important; }
    }

    /* Footer */
    footer{
      background:#070d1f;
      color:#b7c3d9;
      text-align:center;
      padding: 14px 0;
      margin-top: 36px;
    }
  </style>
</head>

<main class="page">
  <section id="home" class="hero">
    <!-- Galaxy layers -->
    <div class="galaxy" aria-hidden="true" id="galaxy">
      <div class="galaxy-nebula" id="g-nebula"></div>
      <div class="galaxy-stars"  id="g-stars"></div>
      <div class="galaxy-twinkle"id="g-twinkle"></div>
      <div class="galaxy-shooting" id="g-shooting"></div>
    </div>

    <div class="container" id="hero-seq">
      <!-- 1) Hello! (typewriter target) -->
      <h1 class="mb-2 text-3d" id="hello"><span class="typewriter typing" id="hello-typing"></span></h1>

      <!-- 2) My name is [Name] -->
      <h2 class="mb-3 text-3d" id="name-line">

      <!-- 3) Welcome to my Portfolio. (ALWAYS visible) -->

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script>
  // ===== CONFIG (TEXT + GALAXY) =====
  const CONFIG = {
    helloText: 'Hello!',
    typingSpeedMs: 85,        // per character
    helloHoldAfterTyping: 250,// pause before flicker
    nameJumpWindowMs: [2000, 5000], // randomize each letter's start within this window
    nameJumpDurationMs: 700,        // matches CSS keyframes duration
    welcomeWordDelayMs: 90,         // stagger between words
    revealDelays: {                 // sequencing between sections
      nameLineAfterHelloMs: 150,
      welcomeAfterNameMs: 120
    },
    // Shooting star cadence
    shootingStarMinDelay: 15000, // 15s
    shootingStarMaxDelay: 25000, // 25s
    // Parallax strength (lower = subtler)
    parallax: {
      nebula: 10,  // px offset at edges
      stars:  6,
      twinkle:4
    }
  };

  (function(){
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Elements
    const helloSpan = document.getElementById('hello-typing');
    const helloH1   = document.getElementById('hello');
    const nameLine  = document.getElementById('name-line');
    const nameSpan  = document.getElementById('name-animated');
    const welcomeEl = document.getElementById('welcome-line');

    // Galaxy layers
    const gNebula   = document.getElementById('g-nebula');
    const gStars    = document.getElementById('g-stars');
    const gTwinkle  = document.getElementById('g-twinkle');
    const gShooting = document.getElementById('g-shooting');
    const hero      = document.querySelector('.hero');

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    /** Typewriter effect for "Hello!" **/
    async function runHello(){
      const text = CONFIG.helloText;
      if (prefersReduced) {
        helloSpan.textContent = text;
        helloSpan.classList.remove('typing');
        helloH1.classList.add('flicker');
        return;
      }
      helloSpan.textContent = '';
      helloSpan.classList.add('typing');
      for (let i = 0; i < text.length; i++){
        helloSpan.textContent += text[i];
        await sleep(CONFIG.typingSpeedMs);
      }
      helloSpan.classList.remove('typing'); // stop caret blinking
      await sleep(CONFIG.helloHoldAfterTyping);
      helloH1.classList.add('flicker');
    }

    /** Slide in "My name is" and animate per-letter jumps on the name **/
    function runNameLine(){
      nameLine.classList.add('line-in');

      const text = nameSpan.textContent;
      nameSpan.textContent = '';
      const frag = document.createDocumentFragment();
      const [winStart, winEnd] = CONFIG.nameJumpWindowMs;

      for (const ch of text){
        if (ch === ' '){
          frag.appendChild(document.createTextNode(' '));
          continue;
        }
        const s = document.createElement('span');
        s.className = 'jump-letter';
        s.textContent = ch;

        if (!prefersReduced){
          const delay = winStart + Math.random() * (winEnd - winStart);
          s.style.animationDelay = `${delay}ms`;
          s.style.animationDuration = `${CONFIG.nameJumpDurationMs}ms`;
        } else {
          s.style.animation = 'none';
        }
        frag.appendChild(s);
      }
      nameSpan.appendChild(frag);
    }

    /** Word-by-word wave for the welcome line — keeps text visible */
    function runWelcome(){
      const words = welcomeEl.textContent.split(' ');
      const frag = document.createDocumentFragment();

      words.forEach((w, i) => {
        const wrapper = document.createElement('span');
        wrapper.className = 'word';
        wrapper.appendChild(document.createTextNode(i ? ' ' : ''));
        const inner = document.createElement('span');
        inner.textContent = w;
        if (!prefersReduced){
          inner.style.animationDelay = `${i * CONFIG.welcomeWordDelayMs}ms`;
        }
        wrapper.appendChild(inner);
        frag.appendChild(wrapper);
      });

      welcomeEl.textContent = '';
      welcomeEl.appendChild(frag);
    }

    /** SHOOTING STARS **/
    function spawnShootingStar(){
      if (prefersReduced) return;
      const star = document.createElement('div');
      star.className = 'shooting-star';

      // Randomize starting position around top-right quadrant
      const startTop = 10 + Math.random() * 70;  // 10% to 80% viewport height
      const startLeft = 90 + Math.random() * 20; // 90% to 110% viewport width (off-screen)
      star.style.top = startTop + 'vh';
      star.style.left = startLeft + 'vw';

      // Randomize size/brightness a bit
      const scale = 0.8 + Math.random() * 1.4; // 0.8x to 2.2x
      star.style.transform = `translate3d(0,0,0) rotate(-18deg) scale(${scale})`;

      // Randomize duration/speed
      const dur = 1.2 + Math.random() * 1.4; // 1.2s–2.6s
      star.style.animation = `shoot ${dur}s ease-out 1 both`;

      // Clean up on finish
      star.addEventListener('animationend', () => star.remove(), { once: true });

      gShooting.appendChild(star);
    }

    // Loop that schedules random stars
    function scheduleStars(){
      if (prefersReduced) return;
      const nextDelay = CONFIG.shootingStarMinDelay + Math.random() * (CONFIG.shootingStarMaxDelay - CONFIG.shootingStarMinDelay);
      setTimeout(() => {
        spawnShootingStar();
        scheduleStars(); // recurse
      }, nextDelay);
    }

    /** PARALLAX TILT (mouse) **/
    function initParallax(){
      if (prefersReduced) return;

      let targetX = 0, targetY = 0;
      let currentX = 0, currentY = 0;
      let raf = null;

      function onMove(e){
        const rect = hero.getBoundingClientRect();
        const cx = rect.left + rect.width/2;
        const cy = rect.top + rect.height/2;
        const x = (e.clientX - cx) / (rect.width/2);  // -1..1
        const y = (e.clientY - cy) / (rect.height/2); // -1..1
        targetX = Math.max(-1, Math.min(1, x));
        targetY = Math.max(-1, Math.min(1, y));
        if (!raf) raf = requestAnimationFrame(update);
      }

      function update(){
        // ease toward target
        currentX += (targetX - currentX) * 0.07;
        currentY += (targetY - currentY) * 0.07;

        // Apply tiny offsets (px)
        const nx = currentX, ny = currentY;
        gNebula.style.transform  = `translate(${-(nx*CONFIG.parallax.nebula)}px, ${-(ny*CONFIG.parallax.nebula)}px) scale(1.02)`;
        gStars.style.transform   = `translate(${-(nx*CONFIG.parallax.stars)}px, ${-(ny*CONFIG.parallax.stars)}px)`;
        gTwinkle.style.transform = `translate(${-(nx*CONFIG.parallax.twinkle)}px, ${-(ny*CONFIG.parallax.twinkle)}px)`;

        // Slight tilt on the container for depth
        document.getElementById('galaxy').style.transform = `rotateX(${ny*2}deg) rotateY(${nx*2}deg)`;

        raf = requestAnimationFrame(() => {
          // stop updating once we’re close to target to save cycles
          if (Math.abs(targetX - currentX) < 0.001 && Math.abs(targetY - currentY) < 0.001) {
            cancelAnimationFrame(raf);
            raf = null;
          } else {
            update();
          }
        });
      }

      // Pointer move for desktops
      window.addEventListener('mousemove', onMove, { passive: true });

      // Fallback: slight auto drift on mobile (no pointer)
      if ('ontouchstart' in window){
        let t = 0;
        setInterval(()=>{
          t += 0.02;
          targetX = Math.sin(t) * 0.2;
          targetY = Math.cos(t*0.8) * 0.15;
          if (!raf) raf = requestAnimationFrame(update);
        }, 100);
      }
    }

    // Master sequence
    (async function(){
      // Text sequence
      await runHello();
      await sleep(CONFIG.revealDelays.nameLineAfterHelloMs);
      runNameLine();
      await sleep(CONFIG.revealDelays.welcomeAfterNameMs);
      runWelcome();

      // Galaxy extras
      scheduleStars();
