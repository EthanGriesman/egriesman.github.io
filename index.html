<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ethan Griesman | Portfolio</title>

  <!-- Bootstrap -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon-180x180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0f1f"/>

  <!-- Your site-wide CSS (kept) -->
  <link href="styles.css" rel="stylesheet" />

  <style>
    :root{
      --bg: #0b1224;
      --bg-grad: linear-gradient(180deg, #0a132a 0%, #0b1224 100%);
      --ink: #e8eef8;
      --ink-muted: #b7c3d9;
      --accent: #0d6efd; /* matches Experience page */
      --btn-ink: #0e1528;
      --ring: rgba(13,110,253,.22);
      --radius: 16px;
      --shadow-hero: 0 20px 60px rgba(7,14,32,.35);
      --container: 1040px;
    }

    html, body { height: 100%; }
    body{
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:
        radial-gradient(1200px 520px at 85% -10%, rgba(13,110,253,.18), transparent 60%),
        var(--bg-grad);
      color: var(--ink);
      margin: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Navbar (same vibe as experience page) */
    .navbar{
      background: linear-gradient(90deg, #0a142c, #081025 60%, #070d1f);
      border-bottom: 1px solid rgba(255,255,255,.06);
      backdrop-filter: saturate(1.2) blur(4px);
    }
    .navbar .navbar-brand{ color:#e8eef8; font-weight:600; letter-spacing:.2px; }
    .navbar-dark .navbar-nav .nav-link{ color:#c9d3e7; }
    .navbar-dark .navbar-nav .nav-link:hover,
    .navbar-dark .navbar-nav .nav-link.active{ color:#ffffff; }

    .page{ padding-top: 84px; }
    .container{ max-width: var(--container); }

    /* HERO */
    .hero{
      padding: clamp(56px, 12vw, 120px) 0 clamp(48px, 8vw, 80px);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero h1{
      font-weight: 800;
      letter-spacing: .4px;
      font-size: clamp(2.2rem, 6vw, 4rem);
      margin: 0 0 .25rem;
      text-shadow: 0 6px 26px rgba(13,110,253,.25);
    }
    .hero h2{
      font-weight: 700;
      font-size: clamp(1.2rem, 3.5vw, 2rem);
      margin: .35rem 0 1rem;
      color: #dbe6ff;
    }
    .hero h3{
      font-weight: 600;
      font-size: clamp(1rem, 2.7vw, 1.25rem);
      color: var(--ink-muted);
      margin: 0 0 1.5rem;
    }
    .name-highlight{
      color: #ffffff;
      text-decoration: underline;
      text-decoration-color: rgba(13,110,253,.55);
      text-underline-offset: .18em;
      text-decoration-thickness: 2px;
    }

    /* CTAs */
    .cta-group{
      display: inline-flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      margin-top: .6rem;
    }
    .btn-hero{
      font-weight: 600;
      padding: .75rem 1.15rem;
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(13,110,253,.22);
      transition: transform .16s ease, box-shadow .16s ease, background-color .16s ease;
    }
    .btn-hero:hover{ transform: translateY(-2px); box-shadow: 0 14px 36px rgba(13,110,253,.3); }

    .btn-primary-hero{
      background: #ffffff;
      color: var(--btn-ink);
      border: none;
    }
    .btn-outline-hero{
      background: transparent;
      color: #ffffff;
      border: 1px solid rgba(255,255,255,.35);
      box-shadow: 0 8px 24px rgba(7,14,32,.25);
    }
    .btn-outline-hero:hover{
      background: rgba(255,255,255,.06);
      border-color: rgba(255,255,255,.55);
    }

    /* Accent glow card behind hero (subtle) */
    .hero-card{
      position: absolute;
      inset: auto 50% -60px 50%;
      transform: translateX(-50%);
      width: min(980px, 92%);
      height: 140px;
      background: radial-gradient(600px 220px at 50% 50%, rgba(13,110,253,.18), transparent 70%);
      filter: blur(18px);
      pointer-events: none;
    }

    /* Respect reduced motion */
    @media (prefers-reduced-motion: reduce){
      .btn-hero{ transition: none; }
      .btn-hero:hover{ transform:none; }
    }

    footer{
      background:#070d1f;
      color:#b7c3d9;
      text-align:center;
      padding: 14px 0;
      margin-top: 36px;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">Ethan Griesman</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#nav" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div id="nav" class="collapse navbar-collapse">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item active"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="experience.html">Experience</a></li>
        <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="page">
  <section id="home" class="hero">
    <div class="container">
      <h1 class="mb-2">Hello!</h1>
      <h2 class="mb-3">My name is <span class="name-highlight">Ethan Griesman</span></h2>
      <h3 class="mb-4">Welcome to my portfolio.</h3>

    </div>

    <!-- decorative glow -->
    <div class="hero-card" aria-hidden="true"></div>
  </section>
</main>

<footer>
  <p class="mb-0">&copy; 2025 Ethan Griesman. All rights reserved.</p>
</footer>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="scripts.js" defer></script>
</body>
</html>
