<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ethan Griesman | Resume</title>

  <!-- Bootstrap -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

  <!-- Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon-180x180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0f1f"/>

  <!-- Site CSS -->
  <link href="styles.css" rel="stylesheet" />

  <style>
    :root{
      --bg: #0b1224;
      --bg-grad: linear-gradient(180deg, #0a132a 0%, #0b1224 100%);
      --ink: #e8eef8;
      --ink-muted: #b7c3d9;
      --accent: #0d6efd;
      --btn-ink: #0e1528;
      --ring: rgba(13,110,253,.22);
      --radius: 16px;
      --shadow-hero: 0 20px 60px rgba(7,14,32,.35);
      --container: 1040px;
    }

    html, body { height: 100%; }
    body{
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:
        radial-gradient(1200px 520px at 85% -10%, rgba(13,110,253,.18), transparent 60%),
        var(--bg-grad);
      color: var(--ink);
      margin: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Navbar (same vibe as portfolio) */
    .navbar{
      background: linear-gradient(90deg, #0a142c, #081025 60%, #070d1f);
      border-bottom: 1px solid rgba(255,255,255,.06);
      backdrop-filter: saturate(1.2) blur(4px);
    }
    .navbar .navbar-brand{ color:#e8eef8; font-weight:600; letter-spacing:.2px; }
    .navbar-dark .navbar-nav .nav-link{ color:#c9d3e7; }
    .navbar-dark .navbar-nav .nav-link:hover,
    .navbar-dark .navbar-nav .nav-link.active{ color:#ffffff; }

    .page{ padding-top: 84px; }
    .container{ max-width: var(--container); }

    /* Header/Hero */
    .hero{
      padding: clamp(48px, 10vw, 96px) 0 clamp(28px, 6vw, 48px);
      text-align: center;
      position: relative;
    }
    .hero h1{
      font-weight: 800;
      letter-spacing: .4px;
      font-size: clamp(2rem, 5.5vw, 3.25rem);
      margin: 0 0 .35rem;
      text-shadow: 0 6px 26px rgba(13,110,253,.25);
    }
    .hero p{
      color: var(--ink-muted);
      margin: 0;
      font-weight: 500;
    }

    /* Resume card */
    .resume-wrap{
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .resume-card{
      width: min(900px, 94%);
      margin: 0 auto;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: var(--radius);
      box-shadow: 0 18px 60px rgba(7,14,32,.35);
      overflow: hidden;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .resume-link{
      display: block;
      text-decoration: none;
      outline: none;
    }
    .resume-link:focus-visible .resume-card{
      border-color: var(--ring);
      box-shadow: 0 18px 60px rgba(7,14,32,.45), 0 0 0 6px var(--ring);
    }
    .resume-card:hover{
      transform: translateY(-2px);
      box-shadow: 0 26px 72px rgba(7,14,32,.5);
    }

    .resume-preview{
      width: 100%;
      aspect-ratio: 8.5 / 11;
      display: block;
      object-fit: cover;
      background:
        linear-gradient(180deg, rgba(13,110,253,.14), rgba(13,110,253,0) 50%),
        radial-gradient(600px 220px at 50% 20%, rgba(13,110,253,.18), transparent 70%),
        #0a132a;
    }
    .resume-meta{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-top: 1px solid rgba(255,255,255,.06);
    }
    .resume-title{
      margin: 0;
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
    }
    .resume-sub{
      margin: 0;
      color: var(--ink-muted);
      font-size: .9rem;
    }

    .btn-row{
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 16px;
    }
    .btn-primary-hero{
      font-weight: 600;
      padding: .7rem 1.1rem;
      border-radius: var(--radius);
      background: #ffffff;
      color: var(--btn-ink);
      border: none;
      box-shadow: 0 8px 24px rgba(13,110,253,.22);
      transition: transform .16s ease, box-shadow .16s ease, background-color .16s ease;
    }
    .btn-primary-hero:hover{
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(13,110,253,.3);
    }
    .btn-outline-hero{
      font-weight: 600;
      padding: .7rem 1.1rem;
      border-radius: var(--radius);
      background: transparent;
      color: #ffffff;
      border: 1px solid rgba(255,255,255,.35);
      box-shadow: 0 8px 24px rgba(7,14,32,.25);
    }
    .btn-outline-hero:hover{
      background: rgba(255,255,255,.06);
      border-color: rgba(255,255,255,.55);
    }

    footer{
      background:#070d1f;
      color:#b7c3d9;
      text-align:center;
      padding: 14px 0;
      margin-top: 36px;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">Ethan Griesman</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#nav" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div id="nav" class="collapse navbar-collapse">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="experience.html">Experience</a></li>
        <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
        <li class="nav-item active"><a class="nav-link" href="resume.html">Resume</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="page">
  <header class="hero">
    <div class="container">
      <h1 class="mb-2">Resume</h1>
      <p>Click the preview to download the PDF.</p>
    </div>
  </header>

  <section class="resume-wrap">
    <!-- Entire card is a download link -->
    <a
      class="resume-link"
      href="/Ethan_Griesman_Resume.pdf"
      download
      aria-label="Download resume PDF"
    >
      <article class="resume-card">
        <!-- Use your exported preview image. If you don’t have one yet, this gracefully shows a styled placeholder. -->
        <img
          class="resume-preview"
          src="/images/resume-preview.png"
          alt="Preview of Ethan Griesman's resume"
          onerror="this.remove();"
        />
        <!-- If the image fails to load, the card still downloads on click -->
        <div class="resume-meta">
          <div>
            <h3 class="resume-title">resume_preview.pdf</h3>
            <p class="resume-sub">PDF • updated 2025</p>
          </div>
          <span class="badge badge-primary" style="background: var(--accent);">Download</span>
        </div>
      </article>
    </a>

    <!-- Accessible fallback buttons -->
    <div class="btn-row">
      <a class="btn btn-primary-hero" href="/Ethan_Griesman_Resume.pdf" download>
        Download PDF
      </a>
      <a class="btn btn-outline-hero" href="/Ethan_Griesman_Resume.pdf" target="_blank" rel="noopener">
        Open in Browser
      </a>
    </div>
  </section>
</main>

<footer>
  <p class="mb-0">&copy; 2026 Ethan Griesman. All rights reserved.</p>
</footer>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<!-- Optional: analytics-friendly event (keeps things lightweight) -->
<script>
  document.querySelectorAll('a[download]').forEach(a=>{
    a.addEventListener('click', ()=> {
      if (window.gtag) gtag('event', 'resume_download', { method: 'click', href: a.href });
    });
  });
</script>
</body>
</html>
